<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahorra Lima — Compara precios de supermercados</title>
<meta name="description" content="Compara precios de Plaza Vea, Wong, Metro, Makro y Vivanda por producto o por tu lista completa, con distancia y recomendación inteligente.">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<body>
<style>
:root{
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F6F7F8;
  --surface-3:#EEF0F2;
  --border:#E2E6EA;
  --ink:#151E27;
  --ink-2:#57626D;
  --ink-3:#8A94A0;
  --brand:#1B6FA8;
  --brand-ink:#0E4568;
  --brand-soft:#DDEAF4;
  --accent:#E0A72E;
  --accent-ink:#6B4A0F;
  --accent-soft:#FBF0D9;
  --on-accent:#2A1D06;
  --good:#1F8A5F;
  --good-soft:#E1F3EA;
  --warning:#A8720E;
  --warning-soft:#FBF0DC;
  --critical:#C1382D;
  --critical-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(15,23,27,.06), 0 10px 26px rgba(15,23,27,.08);
  --radius-s:10px;
  --radius-m:14px;
  --radius-l:22px;
}
/* Sin modo oscuro automático a propósito: la app siempre se ve en blanco,
   sin importar si el teléfono/navegador de quien la abre está en modo oscuro. */
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-0.01em;}
p{margin:0;}
button{font:inherit;}
input,select{font:inherit;}
::selection{background:var(--accent-soft);color:var(--accent-ink);}
a{color:inherit;}
.app-frame{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--surface);
  display:flex;
  flex-direction:column;
  position:relative;
}
@media (min-width:680px){
  body{padding:36px 16px;}
  .app-frame{min-height:calc(100vh - 72px);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border);}
}
.topbar{
  flex-shrink:0;
  position:sticky;top:0;z-index:5;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  min-height:26px;
}
.topbar-title{font-size:16px;font-weight:800;letter-spacing:-0.01em;}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;flex-shrink:0;
  border-radius:999px;border:1px solid transparent;background:none;
  color:var(--ink);cursor:pointer;
}
.iconbtn:hover{background:var(--surface-2);}
.iconbtn:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
.brandmark{display:flex;align-items:center;gap:9px;}
.logo{
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.content{flex:1;min-height:0;overflow-y:auto;padding:18px 16px 28px;animation:fade-in .18s ease-out;}
@media (prefers-reduced-motion: reduce){ .content{animation:none;} * {transition:none !important; animation:none !important;} }
@keyframes fade-in{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.bottomnav{flex-shrink:0;display:flex;border-top:1px solid var(--border);background:var(--surface);}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 12px;color:var(--ink-3);border:0;background:none;cursor:pointer;font-size:11px;font-weight:700;}
.navbtn.active{color:var(--brand);}
.navbtn .dot{position:relative;}
.navcount{position:absolute;top:-4px;right:-8px;background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:9px;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:800;}

.section-label{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:0 0 10px;}
.stack{display:flex;flex-direction:column;gap:12px;}
.stack-sm{display:flex;flex-direction:column;gap:8px;}
.row{display:flex;align-items:center;gap:10px;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hero-title{font-size:24px;font-weight:800;line-height:1.15;margin-bottom:14px;}
.greeting-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;border:0;background:none;padding:0;margin-bottom:6px;font-size:14px;font-weight:700;color:var(--ink-2);cursor:pointer;text-align:left;}
.greeting-add{font-size:12.5px;font-weight:700;color:var(--brand);}
.subtle{color:var(--ink-2);font-size:13.5px;line-height:1.5;}
.faint{color:var(--ink-3);font-size:12px;}

.search-shell{position:relative;}
.search-shell svg.icon-search{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);}
.search-input{
  width:100%;
  padding:14px 14px 14px 42px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--ink);
  font-size:15px;
}
.search-input::placeholder{color:var(--ink-3);}
.search-input:focus{background:var(--surface);border-color:var(--brand);}
.topbar .search-shell{flex:1;}
.topbar .search-input{padding-top:10px;padding-bottom:10px;font-size:14.5px;}

.chipbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.chipbar::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer;}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff;}
.chip[disabled]{opacity:.45;cursor:not-allowed;}

.card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;}
.card-tap{cursor:pointer;}
.card-tap:hover{border-color:var(--brand);}
.card-accent{background:var(--accent-soft);border-color:var(--accent);}
.card-brand{background:var(--brand-soft);border-color:var(--brand);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:999px;border:1px solid transparent;font-weight:800;font-size:14.5px;cursor:pointer;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-accent{background:var(--accent);color:var(--on-accent);}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--ink);}
.btn-ghost:hover{border-color:var(--brand);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:999px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;}
.badge-good{background:var(--good-soft);color:var(--good);}
.badge-accent{background:var(--accent-soft);color:var(--accent-ink);}
.badge-brand{background:var(--brand-soft);color:var(--brand-ink);}
.badge-warn{background:var(--warning-soft);color:var(--warning);}
.badge-critical{background:var(--critical-soft);color:var(--critical);}

.chaindot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.chainpill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 6px;border-radius:999px;font-size:12px;font-weight:700;}

.price{font-weight:800;font-size:19px;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
.price-lg{font-size:26px;}
.price-strike{color:var(--ink-3);text-decoration:line-through;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;}
.unitprice{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;}

.chaingrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.chainchip{padding:6px 8px;border-radius:9px;background:var(--surface);border:1px solid var(--border);}
.chainchip .toprow{display:flex;align-items:center;gap:6px;}
.chainchip .dot{width:7px;height:7px;border-radius:2px;flex-shrink:0;}
.chainchip .cname{flex:1;min-width:0;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;}
.chainchip .cprice{font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;flex-shrink:0;}
.chainchip .cdist{font-size:10.5px;color:var(--ink-3);padding-left:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chainchip.cheapest{border-color:var(--accent);background:var(--accent-soft);}
.chainchip.cheapest .cprice{color:var(--accent-ink);}
.chainchip.unavail{opacity:.55;}
.chainchip.unavail .cprice{font-weight:600;font-size:11px;}

.store-row{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--border);border-radius:var(--radius-m);background:var(--surface);}
.store-row.winner{border-color:var(--accent);background:var(--accent-soft);}
.store-row.unavailable{opacity:.55;}
.store-info{flex:1;min-width:0;}
.store-name{font-weight:800;font-size:14.5px;}
.store-meta{font-size:12px;color:var(--ink-2);margin-top:2px;}
.store-price{text-align:right;flex-shrink:0;}
.badgerow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}

.qtystep{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:999px;overflow:hidden;}
.qtystep button{width:32px;height:32px;border:0;background:var(--surface);color:var(--ink);font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qtystep button:hover{background:var(--surface-2);}
.qtystep .qtyval{width:28px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;}

.listitem{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-m);background:var(--surface);}
.listitem-name{font-weight:700;font-size:14px;}
.listitem-meta{font-size:12px;color:var(--ink-2);margin-top:2px;}

.empty{text-align:center;padding:40px 18px;color:var(--ink-2);}
.empty svg{color:var(--ink-3);margin-bottom:10px;}
.empty-title{font-weight:800;color:var(--ink);margin-bottom:4px;font-size:15px;}

.sparkwrap{display:flex;align-items:flex-end;gap:12px;}
.sparkwrap svg{flex-shrink:0;}

.divider{height:1px;background:var(--border);margin:16px 0;border:0;}
.link-btn{background:none;border:0;color:var(--brand);font-weight:700;font-size:13.5px;cursor:pointer;padding:0;}

.modalback{position:fixed;inset:0;background:rgba(10,16,14,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;}
@media (min-width:680px){.modalback{align-items:center;}}
.modalcard{background:var(--surface);border-radius:20px 20px 0 0;max-width:480px;width:100%;max-height:82vh;overflow-y:auto;padding:20px;box-shadow:var(--shadow);}
@media (min-width:680px){.modalcard{border-radius:20px;}}

.freshbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-s);background:var(--brand-soft);color:var(--brand-ink);font-size:12.5px;font-weight:600;}
.stale-note{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-s);background:var(--warning-soft);color:var(--warning);font-size:12.5px;font-weight:700;}

table.plain{width:100%;border-collapse:collapse;}
.scrollx{overflow-x:auto;}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px;}
</style>

<div class="app-frame" id="appFrame">
  <header class="topbar" id="topbar"></header>
  <main class="content" id="content"></main>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";

/* ---------------- storage ---------------- */
const memStore = {};
const storage = {
  get(k, fallback){ try{ const v = localStorage.getItem(k); return v==null? fallback : JSON.parse(v); }catch(e){ return (k in memStore)? memStore[k] : fallback; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ memStore[k]=v; } }
};

/* ---------------- utils ---------------- */
function hashStr(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
function mulberry32(seed){ let a = seed>>>0; return function(){ a|=0; a = a+0x6D2B79F5|0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function rand01(key){ return mulberry32(hashStr(key))(); }
function normalize(str){ return (str||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9\s.]/g," ").replace(/\s+/g," ").trim(); }
function formatSoles(n){ return "S/ " + n.toFixed(2); }
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function formatDistance(km){ if(km<1) return Math.round(km*1000)+" m"; return km.toFixed(1)+" km"; }
function levenshtein(a,b){
  if(a===b) return 0;
  const m=a.length,n=b.length;
  if(m===0) return n; if(n===0) return m;
  let prev = new Array(n+1); for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
    }
    prev=cur;
  }
  return prev[n];
}
function isLight(hex){
  const c = hex.replace("#","");
  const r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  return (0.299*r+0.587*g+0.114*b) > 150;
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtTime(date){ return date.toLocaleTimeString("es-PE",{hour:"numeric",minute:"2-digit",hour12:true}); }
function formatUpdated(date){
  const now=new Date();
  if(date.toDateString()===now.toDateString()) return "Hoy, "+fmtTime(date);
  const y=new Date(now); y.setDate(now.getDate()-1);
  if(date.toDateString()===y.toDateString()) return "Ayer, "+fmtTime(date);
  const days=Math.floor((now-date)/86400000);
  return "Hace "+days+" días";
}
function isStale(date){ return (Date.now()-date.getTime()) > 24*3600*1000; }

/* ---------------- icons ---------------- */
function ic(name, size){
  size = size||20;
  const p = 'stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  const map = {
    search:`<circle cx="11" cy="11" r="7" ${p}/><line x1="21" y1="21" x2="16.6" y2="16.6" ${p}/>`,
    home:`<path d="M4 11.5 12 4l8 7.5" ${p}/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9" ${p}/>`,
    list:`<rect x="4" y="4" y2="4" width="16" height="16" rx="3" ${p}/><path d="M8 9h8M8 12.5h8M8 16h5" ${p}/>`,
    star:`<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.2 1 5.9L12 17l-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z" ${p} stroke-linejoin="round"/>`,
    starFill:`<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.2 1 5.9L12 17l-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>`,
    pin:`<path d="M12 21s7-6.3 7-12a7 7 0 0 0-14 0c0 5.7 7 12 7 12z" ${p}/><circle cx="12" cy="9" r="2.4" ${p}/>`,
    chevronLeft:`<path d="M14.5 5 8 12l6.5 7" ${p}/>`,
    chevronRight:`<path d="M9.5 5 16 12l-6.5 7" ${p}/>`,
    close:`<path d="M6 6l12 12M18 6 6 18" ${p}/>`,
    plus:`<path d="M12 5v14M5 12h14" ${p}/>`,
    minus:`<path d="M5 12h14" ${p}/>`,
    check:`<path d="M4.5 12.5l5 5L20 6.5" ${p}/>`,
    clock:`<circle cx="12" cy="12" r="8.5" ${p}/><path d="M12 7.5V12l3.2 2" ${p}/>`,
    trendDown:`<path d="M4 7l6.5 6.5L14 10l6 6" ${p}/><path d="M20 11v5h-5" ${p}/>`,
    trendUp:`<path d="M4 17l6.5-6.5L14 14l6-6" ${p}/><path d="M20 13V8h-5" ${p}/>`,
    info:`<circle cx="12" cy="12" r="8.5" ${p}/><path d="M12 11v5.5M12 8v.01" ${p}/>`,
    sliders:`<path d="M5 6h14M5 12h14M5 18h14" ${p}/><circle cx="9" cy="6" r="1.8" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1.8" fill="currentColor" stroke="none"/><circle cx="10" cy="18" r="1.8" fill="currentColor" stroke="none"/>`,
    tag:`<path d="M4 4h7l9 9-7 7-9-9V4z" ${p} stroke-linejoin="round"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/>`,
    store:`<path d="M4 9l1.2-4.5A1 1 0 0 1 6.2 4h11.6a1 1 0 0 1 1 .8L20 9" ${p}/><path d="M4.5 9h15v9.5a1 1 0 0 1-1 1H5.5a1 1 0 0 1-1-1V9z" ${p}/><path d="M9 19.5V14h6v5.5" ${p}/>`,
    scale:`<path d="M12 3v18M6 8l-2.5 5.5A3 3 0 0 0 6 17a3 3 0 0 0 2.5-3.5L6 8zM18 8l-2.5 5.5A3 3 0 0 0 18 17a3 3 0 0 0 2.5-3.5L18 8zM7 3h10" ${p}/>`,
    walk:`<circle cx="13" cy="4.5" r="1.7" fill="currentColor" stroke="none"/><path d="M10 8l3-1 2.5 2.5L18 11M9 21l2-6 1-3M14 21l-1.5-5L15 13" ${p}/>`
  };

async function fetchTable(name, query){

async function loadRealData(){
  const [products, prices, history] = await Promise.all([
    fetchTable("products", "select=id,name,presentation,qty,unit,search_terms,brands(name),categories(name)&order=name"),
    fetchTable("product_prices", "select=product_id,supermarket_id,price,list_price,available,source_url,verified_at,last_attempt_at,last_error"),
    fetchTable("price_history", "select=product_id,supermarket_id,price,recorded_at&order=recorded_at.asc")
  ]);

  PRODUCTS = products.map(row=>({
    id: row.id,
    name: row.name,
    brand: row.brands ? row.brands.name : "",
    category: row.categories ? row.categories.name : "",

    qty: Number(row.qty) || 1,
    unit: row.unit || "unidad",
    synonyms: row.search_terms || []
  }));
  PRODUCT_BY_ID = Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));

  PRICES = {};
  prices.forEach(row=>{ PRICES[row.product_id+"|"+row.supermarket_id] = row; });

  HISTORY = {};

/* pricing — leídos de Supabase (ver loadRealData). El precio es a nivel de
   cadena, igual que el precio web real de estas tiendas (no varía por local). */
function isAvailable(pid,chain){
  const row = PRICES[pid+"|"+chain];
  return !!(row && row.price!=null);
}
function updatedAt(pid,chain){
  const row = PRICES[pid+"|"+chain];
  const iso = row && (row.verified_at || row.last_attempt_at);
  return iso ? new Date(iso) : new Date(0);
}
function priceAtStoreKey(product, chain, storeKey){
  const row = PRICES[product.id+"|"+chain];
  return row && row.price!=null ? row.price : null;
}
function nearestStore(chain, loc){
  if(!loc) return null;
  let best=null,bestD=Infinity;
  STORES.filter(s=>s.chain===chain).forEach(s=>{
    const d = haversineKm(loc.lat,loc.lng,s.lat,s.lng);
    if(d<bestD){bestD=d;best=s;}
  });
  return best ? {store:best, distanceKm:bestD} : null;
}
function buyUrl(pid, chain){
  const row = PRICES[pid+"|"+chain];
  return row && row.source_url ? row.source_url : null;
}
function chainOffer(product, chain, loc){
  const available = isAvailable(product.id, chain);
  const near = loc ? nearestStore(chain, loc) : null;
  const storeKey = near ? near.store.id : chain+"-base";
  const price = priceAtStoreKey(product, chain, storeKey);
  return {
    chain, price, available,
    store: near ? near.store : null,
    distanceKm: near ? near.distanceKm : null,
    updated: updatedAt(product.id, chain),
    buyUrl: buyUrl(product.id, chain)
  };
}
function allOffers(product, loc){
  return SUPERMARKETS.map(s=>chainOffer(product, s.id, loc));
}
function nearbyStoreOffers(product, loc, limit){
  return STORES.map(s=>({
    chain: s.chain,
    price: priceAtStoreKey(product, s.chain, s.id),
    available: isAvailable(product.id, s.chain),
    store: s,
    distanceKm: haversineKm(loc.lat, loc.lng, s.lat, s.lng),
    updated: updatedAt(product.id, s.chain)
  })).sort((a,b)=>a.distanceKm-b.distanceKm).slice(0, limit||8);
}
function unitPriceLabel(product, price){
  let baseQty, label;
  if(product.unit==="L"){ baseQty=product.qty; label="litro"; }
  else if(product.unit==="ml"){ baseQty=product.qty/1000; label="litro"; }
  else if(product.unit==="kg"){ baseQty=product.qty; label="kilo"; }
  else if(product.unit==="g"){ baseQty=product.qty/1000; label="kilo"; }
  else { baseQty=product.qty; label="unidad"; }
  if(label==="unidad" && baseQty<=1) return null;
  return formatSoles(price/baseQty) + " por " + label;
}

/* price history (deterministic 30-day walk ending at today's base price) */
function priceHistory(product, chain){
  const rows = HISTORY[product.id+"|"+chain];
  if(!rows || rows.length<2) return null;
  return rows.map(r=>r.price);
}
function historyInsight(vals){
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  const today = vals[vals.length-1];
  const pct = ((today-avg)/avg)*100;
  return {avg, today, pct};
}

/* search */
const SYNONYM_PHRASES = [
  ["coca zero","coca-cola zero"],["coca cola zero","coca-cola zero"],["cocacola zero","coca-cola zero"],
  ["papel elite","papel higienico elite"],["papel noble","papel higienico noble"],
  ["gaseosa","bebida gaseosa"],["refresco","bebida"],["huevo","huevos"],["pollo entero","pollo"],
  ["yogurt griego","yogurt griego"],["coca cola","coca-cola"],["cocacola","coca-cola"]
];
function expandQuery(q){
  let out = q;
  SYNONYM_PHRASES.forEach(([a,b])=>{ if(out.includes(a) && !out.includes(b)) out += " " + b; });
  return out;
}
function productBlob(p){
  if(p._blob) return p._blob;
  const blob = normalize([p.name,p.brand,p.category,p.presentation,(p.synonyms||[]).join(" ")].join(" "));
  p._blob = blob;
  p._tokens = Array.from(new Set(blob.split(" ").filter(Boolean)));
  p._nameBlob = normalize(p.name+" "+p.brand);
  return blob;
}
function searchProducts(query, limit){
  const nq = normalize(expandQuery(normalize(query)));
  const qTokens = nq.split(" ").filter(Boolean);
  if(qTokens.length===0) return [];
  const scored = PRODUCTS.map(p=>{
    productBlob(p);
    let score=0;
    for(const qt of qTokens){
      if(qt.length<2) continue;
      if(p._blob.includes(qt)){
        score += p._nameBlob.includes(qt) ? 12 : 8;
        if(p._nameBlob.startsWith(qt)) score += 4;
        continue;
      }
      let best=Infinity;
      for(const ht of p._tokens){
        if(Math.abs(ht.length-qt.length)>3) continue;
        const d = levenshtein(qt,ht);
        if(d<best) best=d;
      }
      const tol = qt.length<=4?1:2;
      if(best<=tol) score += Math.max(1, 8-best*3);
    }
    return {p, score};
  }).filter(x=>x.score>0);
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0, limit||40);
}
function closestSuggestion(query){
  const res = searchProducts(query, 1);
  return res.length ? res[0].p : null;
}

/* recommendation scoring */
const DISTANCE_COST_PER_KM = 1.3;
const MULTISTORE_HASSLE = 3.0;
const MISSING_ITEM_PENALTY = 8.0;
function optionScore({total, distanceKm, missing, storesVisited}){
  return total + (distanceKm||0)*DISTANCE_COST_PER_KM + Math.max(0,storesVisited-1)*MULTISTORE_HASSLE + missing*MISSING_ITEM_PENALTY;
}

function listQty(pid){ const it = state.list.find(x=>x.productId===pid); return it? it.qty : 0; }
function setListQty(pid, qty){
  qty = Math.max(0, Math.min(20, qty));
  const idx = state.list.findIndex(x=>x.productId===pid);
  if(qty===0){ if(idx>=0) state.list.splice(idx,1); }
  else if(idx>=0){ state.list[idx].qty=qty; }
  else { state.list.push({productId:pid, qty}); }
  saveList();
  if(state.session && state.listId){
    const uid = state.session.user.id;
    if(qty===0){
      sb.from("shopping_list_items").delete()
        .eq("shopping_list_id", state.listId).eq("product_id", pid)
        .then(({error})=>{ if(error) console.error("No se pudo quitar de la lista en la nube:", error); });
    } else {
      sb.from("shopping_list_items").upsert(
        {shopping_list_id: state.listId, product_id: pid, qty},
        {onConflict: "shopping_list_id,product_id"}
      ).then(({error})=>{ if(error) console.error("No se pudo guardar la lista en la nube:", error); });
    }
  }
}
function isFav(pid){ return state.favorites.includes(pid); }
function toggleFav(pid){
  const i = state.favorites.indexOf(pid);
  const adding = i < 0;
  if(adding) state.favorites.push(pid); else state.favorites.splice(i,1);
  saveFav();
  if(state.session){
    const uid = state.session.user.id;
    const q = adding
      ? sb.from("favorites").insert({user_id: uid, product_id: pid})
      : sb.from("favorites").delete().eq("user_id", uid).eq("product_id", pid);
    q.then(({error})=>{ if(error) console.error("No se pudo guardar el favorito en la nube:", error); });
  }
}

async function ensureShoppingList(uid){
  const { data: existing } = await sb.from("shopping_lists").select("id").eq("user_id", uid).limit(1).maybeSingle();
  if(existing) return existing.id;
  const { data: created, error } = await sb.from("shopping_lists").insert({user_id: uid}).select("id").single();
  if(error){ console.error("No se pudo crear la lista en la nube:", error); return null; }
  return created.id;
}
// Al iniciar sesión: si la nube ya tiene datos (otro dispositivo), esos
// mandan. Si la nube está vacía pero había datos en este teléfono (modo
// invitado), se suben una sola vez — así no se pierde lo que ya tenías.
async function syncAfterLogin(session){
  state.syncing = true; render();
  try{
    const uid = session.user.id;
    await sb.from("users").upsert({id: uid, email: session.user.email}, {onConflict: "id"});
    const listId = await ensureShoppingList(uid);
    state.listId = listId;

    const [{data: cloudFavs}, {data: cloudItems}] = await Promise.all([
      sb.from("favorites").select("product_id").eq("user_id", uid),
      listId ? sb.from("shopping_list_items").select("product_id, qty").eq("shopping_list_id", listId) : Promise.resolve({data: []})
    ]);

    if((cloudFavs||[]).length === 0 && state.favorites.length > 0){
      await sb.from("favorites").insert(state.favorites.map(pid=>({user_id: uid, product_id: pid})));
    } else {
      state.favorites = (cloudFavs||[]).map(r=>r.product_id);
      saveFav();
    }

    if((cloudItems||[]).length === 0 && state.list.length > 0 && listId){
      await sb.from("shopping_list_items").insert(state.list.map(it=>({shopping_list_id: listId, product_id: it.productId, qty: it.qty})));
    } else {
      state.list = (cloudItems||[]).map(r=>({productId: r.product_id, qty: r.qty}));
      saveList();
    }
  } catch(err){
    console.error("Error sincronizando con la nube:", err);
  } finally {
    state.syncing = false; render();
  }
}
sb.auth.onAuthStateChange((event, session)=>{
  state.session = session;
  if(session){
    state.modal = null;
    syncAfterLogin(session);
  } else {
    state.listId = null;
  }
});

function requestGeolocation(){
  if(!("geolocation" in navigator)){
    state.modal = {type:"error", text:"Este navegador no soporta geolocalización. Ingresa tu distrito manualmente."};
    renderModal();
    return;
  }
  state.modal = {type:"loading", text:"Obteniendo tu ubicación…"};
  renderModal();
  navigator.geolocation.getCurrentPosition(function(pos){
    state.location = {lat:pos.coords.latitude, lng:pos.coords.longitude, label:"Tu ubicación actual", manual:false};
    state.geoError = null;
    saveLoc();
    state.modal=null;
    go("home");
  }, function(err){
    // No tocar state.location: si ya había una (manual o vieja), se sigue
    // mostrando — pero geoError queda marcado para avisarlo en la
    // pantalla de inicio, en vez de que el fallo desaparezca sin dejar rastro.
    const denied = err && err.code === 1;
    state.geoError = denied
      ? "Tu navegador bloqueó el permiso de ubicación para esta página."
      : "No pudimos obtener tu ubicación automáticamente" + (err && err.message ? " (" + err.message + ")" : "") + ".";
    state.modal = {
      type:"error",
      text: state.geoError + (denied
        ? " Revisa los permisos de ubicación de tu navegador o del teléfono para este sitio, o elige tu distrito en la lista de abajo."
        : " Elige tu distrito en la lista de abajo o inténtalo de nuevo.")
    };
    renderModal();
  }, {enableHighAccuracy:false, timeout:8000, maximumAge:0});
}

function chainPill(chainId){

function freshnessBadge(offer){
  if(!offer.available) return `<span class="badge badge-critical">No encontrado</span>`;
  if(isStale(offer.updated)) return `<span class="badge badge-warn">${ic("clock",11)} Sin verificar hoy</span>`;
  return `<span class="badge badge-good">${ic("clock",11)} ${formatUpdated(offer.updated)}</span>`;

function starBtn(pid, size){
  const fav = isFav(pid);
  return `<button class="iconbtn" data-action="toggle-fav" data-id="${pid}" aria-label="Favorito" style="color:${fav?'var(--accent)':'var(--ink-3)'};">${ic(fav?"starFill":"star", size||20)}</button>`;
}
function qtyStepper(pid){
  const qty = listQty(pid);
  if(qty===0){
    return `<button class="btn btn-ghost btn-sm" data-action="qty-inc" data-id="${pid}">${ic("plus",14)} Agregar</button>`;
  }
  return `<div class="qtystep">
    <button data-action="qty-dec" data-id="${pid}" aria-label="Quitar uno">${ic("minus",14)}</button>
    <span class="qtyval">${qty}</span>
    <button data-action="qty-inc" data-id="${pid}" aria-label="Agregar uno">${ic("plus",14)}</button>
  </div>`;
}
function sparkSVG(vals, color){
  const w=120,h=40,pad=3;
  const min=Math.min(...vals), max=Math.max(...vals);
  const range = (max-min)||1;
  const pts = vals.map((v,i)=>{
    const x = pad + (i/(vals.length-1))*(w-pad*2);
    const y = pad + (1-(v-min)/range)*(h-pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  const lastX = w-pad, lastY = pad + (1-(vals[vals.length-1]-min)/range)*(h-pad*2);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastX}" cy="${lastY.toFixed(1)}" r="3" fill="${color}"/>
  </svg>`;
}
function emptyState(icon, title, sub, actionHtml){
  return `<div class="empty">${ic(icon,40)}<div class="empty-title">${title}</div><p class="subtle">${sub}</p>${actionHtml?`<div style="margin-top:14px;">${actionHtml}</div>`:""}</div>`;
}

function offersNearYou(){
  const results = [];
  PRODUCTS.forEach(p=>{
    SUPERMARKETS.forEach(s=>{
      if(!isAvailable(p.id,s.id)) return;
      const vals = priceHistory(p, s.id);
      if(!vals) return;
      const {pct, today} = historyInsight(vals);
      if(pct<=-8){

        results.push({product:p, chain:s.id, pct, price:today, distanceKm: near?near.distanceKm:null});
      }
    });
  });
  results.sort((a,b)=> a.pct - b.pct);
  return results;
}

/* ---------------- comparison engine ---------------- */
function buildComparison(){
  const items = state.list.map(it=>({item:it, product:PRODUCT_BY_ID[it.productId]})).filter(x=>x.product);
  const totalItems = items.length;

  const perChain = SUPERMARKETS.map(s=>{
    let total=0, available=0, missing=[];
    items.forEach(({item,product})=>{
      if(isAvailable(product.id, s.id)){
        const price = priceAtStoreKey(product, s.id, (state.location&&nearestStore(s.id,state.location))? nearestStore(s.id,state.location).store.id : s.id+"-base");
        total += price*item.qty; available++;
      } else { missing.push(product); }
    });
    const near = state.location ? nearestStore(s.id, state.location) : null;
    return {chain:s.id, total, available, missing, distanceKm: near?near.distanceKm:null, storesVisited:1,
      score: optionScore({total, distanceKm: near?near.distanceKm:0, missing:missing.length, storesVisited:1})};
  });
  const perChainFull = perChain.filter(c=>c.available>0).sort((a,b)=>a.total-b.total);

  const comboByChain = {};
  let comboTotal=0, comboMissing=[];
  items.forEach(({item,product})=>{
    let best=null;
    SUPERMARKETS.forEach(s=>{
      if(!isAvailable(product.id,s.id)) return;
      const near = state.location ? nearestStore(s.id,state.location) : null;
      const price = priceAtStoreKey(product, s.id, near? near.store.id : s.id+"-base");
      if(!best || price<best.price) best = {chain:s.id, price};
    });
    if(best){
      comboTotal += best.price*item.qty;
      (comboByChain[best.chain] = comboByChain[best.chain]||[]).push({product, qty:item.qty, price:best.price});
    } else { comboMissing.push(product); }
  });
  const comboChains = Object.keys(comboByChain);
  const comboDistances = comboChains.map(c=>{
    const near = state.location? nearestStore(c,state.location) : null;
    return {chain:c, distanceKm: near? near.distanceKm : null};
  });
  const comboDistanceSum = state.location ? comboDistances.reduce((a,c)=>a+(c.distanceKm||0),0) : null;
  const comboOption = {
    total: comboTotal, chains: comboChains, byChain: comboByChain, missing: comboMissing,
    distanceKm: comboDistanceSum, storesVisited: comboChains.length,
    score: optionScore({total:comboTotal, distanceKm: comboDistanceSum||0, missing:comboMissing.length, storesVisited:comboChains.length})
  };

  const allOptions = [...perChainFull.map(c=>({type:"single", ...c})), {type:"combo", ...comboOption}];
  // Nunca recomendar (ni marcar "más barato") una opción que no cubre casi
  // toda la lista, sin importar qué tan barata sea esa fracción — de nada
  // sirve el precio más bajo si te faltan 5 de 6 productos al llegar.
  // Se prefieren las opciones completas; si ninguna cubre el 100%, recién
  // ahí se compara contra todas (mejor una recomendación imperfecta que
  // ninguna, para listas muy grandes donde nadie tiene todo).
  const completeOptions = allOptions.filter(o=>o.missing.length===0);
  const pool = completeOptions.length ? completeOptions : allOptions;
  const recommended = pool.slice().sort((a,b)=>a.score-b.score)[0];
  const cheapestOverall = pool.slice().sort((a,b)=>a.total-b.total)[0];

  return {totalItems, perChainFull, comboOption, recommended, cheapestOverall};
}

function optionLabel(o){ return o.type==="combo" ? "Combinar " + o.chains.map(c=>SM[c].name).join(" + ") : SM[o.chain].name; }

// Resume una comparación en "¿la más barata es igual a la recomendada?" y,
// si no, un mensaje honesto sobre si vale la pena el rodeo extra. Se usa
// tanto en el resumen de la pantalla de inicio como en el detalle de la lista.
function comparisonInsight(cmp){
  const rec = cmp.recommended;
  const cheap = cmp.cheapestOverall;
  const sameOption = rec===cheap || (rec.type===cheap.type && rec.chain===cheap.chain);
  let savingsMsg = "";
  if(!sameOption){
    const realSavings = rec.total - cheap.total;
    const extraDistance = state.location && rec.distanceKm!=null && cheap.distanceKm!=null ? Math.max(0, cheap.distanceKm - (rec.type==='single'? rec.distanceKm : 0)) : null;
    if(state.location && cheap.distanceKm!=null){
      const perKm = extraDistance>0 ? realSavings/extraDistance : Infinity;
      savingsMsg = perKm>=2.5 || extraDistance<=0.3
        ? `Vale la pena: ahorras ${formatSoles(realSavings)} y la ruta adicional es de solo ${formatDistance(extraDistance||0)}.`
        : `Ahorras ${formatSoles(realSavings)} pero recorrerías ${formatDistance(extraDistance||0)} adicionales. Quizás te conviene simplemente comprar todo en ${optionLabel(rec)}.`;
    } else {
      savingsMsg = `Podrías ahorrar ${formatSoles(realSavings)} combinando supermercados. Activa tu ubicación para saber si la distancia extra vale la pena.`;
    }
  }
  return {rec, cheap, sameOption, savingsMsg};
}

  if(state.list.length===0) return emptyState("list","Tu lista está vacía","Agrega productos primero.", `<button class="btn btn-primary" data-action="open-search">Buscar productos</button>`);

  const {rec, cheap, sameOption, savingsMsg} = comparisonInsight(cmp);

  function optionCard(o, kind){
    const badge = kind==="rec" ? '<span class="badge badge-good">Recomendado</span>' : '<span class="badge badge-accent">Más barato</span>';
    const missingCount = o.type==="combo" ? o.missing.length : o.missing.length;

        ${o.type==="combo" ? `<div class="row faint" style="gap:6px;">${ic("store",14)} ${o.storesVisited} supermercado${o.storesVisited===1?"":"s"} a visitar</div>` : ""}
      </div>
    </div>`;
  }

  return `

    ${cmp.comboOption.chains.map(c=>`
      <div class="card">
        <div class="row" style="margin-bottom:6px;">${chainPill(c)}</div>
        ${cmp.comboOption.byChain[c].map(x=>`<div class="row-between" style="font-size:13px;padding:3px 0;"><span>${x.qty>1?x.qty+"× ":""}${esc(x.product.name)}</span><span class="faint">${formatSoles(x.price*x.qty)}</span></div>`).join("")}
      </div>
    `).join("")}
  </div>` : ""}

  <hr class="divider"/>

  <div class="scrollx">
  <table class="plain">
    <tbody>
    ${cmp.perChainFull.map((c,i)=>`
      <tr style="border-bottom:1px solid var(--border);">
        <td style="padding:10px 4px;"><div class="row" style="gap:8px;">${chainPill(c.chain)}${c.missing.length?`<span class="faint">(${c.missing.length} sin stock)</span>`:""}</div></td>
        <td style="padding:10px 4px;text-align:right;" class="price">${formatSoles(c.total)}</td>
      </tr>`).join("")}
    </tbody>
  </table>
  </div>
  `;
}

/* ---------------- modal ---------------- */
function renderModal(){
  const root = document.getElementById("modalRoot");
  if(!state.modal){ root.innerHTML=""; return; }
  const m = state.modal;
  let body = "";
  if(m.type==="loading"){
    body = `<div class="empty" style="padding:24px 0;">${ic("pin",34)}<p class="subtle" style="margin-top:10px;">${esc(m.text)}</p></div>`;
  } else if(m.type==="error"){
    body = `<div class="stack">
      <div class="row" style="gap:8px;"><span style="color:var(--warning);">${ic("info",20)}</span><strong>No pudimos ubicarte</strong></div>
      <p class="subtle">${esc(m.text)}</p>
      <button class="btn btn-primary btn-block" data-action="close-modal">Entendido</button>
    </div>`;
  } else if(m.type==="name"){
    body = `<div class="stack">
      <div>
        <strong style="font-size:16px;">¿Cómo te llamas?</strong>
        <p class="subtle" style="margin-top:4px;">Lo usamos solo para saludarte. Se guarda únicamente en este dispositivo.</p>
      </div>
      <input id="nameInput" class="search-input" type="text" autocomplete="off" maxlength="30"
        placeholder="Tu nombre" value="${esc(state.userName||"")}" style="padding-left:14px;" />
      <button class="btn btn-primary btn-block" data-action="save-name">Guardar</button>
    </div>`;
  } else if(m.type==="login"){
    if(m.step==="sent"){
      body = `<div class="stack">
        <div class="row" style="gap:8px;"><span style="color:var(--good);">${ic("check",20)}</span><strong>Revisa tu correo</strong></div>
        <p class="subtle">Te enviamos un link a <strong>${esc(m.email)}</strong>. Ábrelo desde este mismo teléfono para iniciar sesión.</p>
        <button class="btn btn-ghost btn-block" data-action="close-modal">Cerrar</button>
      </div>`;
    } else {
      const sending = m.step==="sending";
      body = `<div class="stack">
        <div>
          <strong style="font-size:16px;">Guarda tu lista en la nube</strong>
          <p class="subtle" style="margin-top:4px;">Opcional. Con tu correo te mandamos un link para entrar — sin contraseñas. Así tu lista y favoritos te esperan en cualquier dispositivo.</p>
        </div>
        <input id="loginEmailInput" class="search-input" type="email" autocomplete="email" placeholder="tu@correo.com" style="padding-left:14px;" ${sending?"disabled":""} />
        ${m.error ? `<p class="subtle" style="color:var(--critical);">${esc(m.error)}</p>` : ""}
        <button class="btn btn-primary btn-block" data-action="send-magic-link" ${sending?"disabled":""}>${sending?"Enviando…":"Enviarme el link"}</button>
      </div>`;
    }
  }
  root.innerHTML = `<div class="modalback" data-action="close-modal">
    <div class="modalcard" data-action="noop">
      ${m.type!=='loading' ? `<div class="row-between" style="margin-bottom:12px;"><strong></strong><button class="iconbtn" data-action="close-modal">${ic("close")}</button></div>`:""}
      ${body}
    </div>
  </div>`;
}

function renderBootChrome(){
  document.getElementById("topbar").innerHTML = `<div class="brandmark" style="flex:1;"><div class="logo">${logoMark(20)}</div><div class="topbar-title">Ahorra Lima</div></div>`;
  document.getElementById("bottomnav").style.display = "none";
}
function boot(){
  renderBootChrome();
  document.getElementById("content").innerHTML = emptyState("pin","Cargando precios reales…","Un momento, estamos trayendo los precios más recientes de cada tienda.");
  loadRealData().then(()=>{ render(); }).catch(()=>{
    renderBootChrome();
    document.getElementById("content").innerHTML = emptyState("info","No pudimos cargar los precios",
      "Revisa tu conexión a internet e intenta de nuevo.",
      `<button class="btn btn-primary" data-action="boot-retry">Reintentar</button>`);
  });
}
boot();
})();
